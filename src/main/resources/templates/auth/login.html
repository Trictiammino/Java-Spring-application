<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* Layout moderno, pulito e "light" coerente con le altre pagine */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(100% 100% at 50% 0%, #e5e7eb 0%, #cbd5e1 100%);
            color: #1f2937;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin-top: 0;
            margin-bottom: 24px;
            letter-spacing: -0.5px;
        }

        /* Form trasformato in container minimale con effetto glassmorphism soffuso */
        form {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 35px;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03),
                        0 20px 40px -4px rgba(0, 0, 0, 0.05),
                        inset 0 0 0 1px rgba(255, 255, 255, 0.6);
            text-align: center;
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
        }

        /* Uniformiamo tutti gli input con uno stile pulito e bordi discreti */
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            margin: 0; /* Gestito con i tag <br> originali */
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #1f2937;
            outline: none;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        /* Focus degli input elegante e visibile senza alterare il layout */
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            background: #ffffff;
        }

        /* Placeholder più discreti */
        input::placeholder {
            color: #9ca3af;
        }

        /* Pulsante Login con transizioni fluide e micro-interazioni moderne */
        button {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            box-sizing: border-box;
            background: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.25);
        }

        button:active {
            transform: translateY(0);
        }

        /* Stile mantenuto anche per la classe inutilizzata nel markup ma presente nel tuo CSS originale */
        .refresh-btn {
            background: #f3f4f6;
            color: #1f2937;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
        }

        .refresh-btn:hover {
            background: #e5e7eb;
            color: #111827;
            transform: translateY(-1px);
        }

        /* Elemento per i messaggi di successo o errore (Grigio scuro neutro di base per leggibilità) */
        #result {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
            line-height: 1.5;
            text-align: center;
        }
    </style>
</head>
<body>

<h2>Login</h2>

<form id="loginForm">
    <input type="text" id="email" placeholder="Email" required><br><br>
    <input type="password" id="password" placeholder="Password" required><br><br>
    <button type="submit">Login</button>
</form>

<p id="result"></p>


<script>
    // Login
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const res = await fetch("/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password }),
                credentials: "include" // assicura invio cookie HttpOnly
            });

            if (res.ok) {
                document.getElementById("result").innerText = "Login effettuato!";
                setTimeout(() => {
                    window.location.href = "/home/profile";
                }, 1500);

            } else {
                document.getElementById("result").innerText = "Login fallito!";
            }
        } catch (err) {
            console.error(err);
            document.getElementById("result").innerText = "Errore di connessione!";
        }
    });

</script>

</body>
</html>
